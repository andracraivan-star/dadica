<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DADICA</title>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      text-align:center;
      padding:24px;
      box-sizing:border-box;
      background:#fff;
    }
    h1{
      font-size:72px;
      margin:0 0 12px 0;
      letter-spacing:1px;
    }
    .subtitle{
      font-size:22px;
      margin:0 0 18px 0;
      opacity:0.8;
    }
    button{
      font-size:20px;
      padding:14px 18px;
      border-radius:14px;
      margin:6px;
      border:2px solid #333;
      background:#eee;
    }
    #risultato{
      margin-top:18px;
      font-size:26px;
      min-height:120px;
      width:100%;
      max-width:700px;
    }
    details{
      margin-top:18px;
      max-width:700px;
      width:100%;
      font-size:18px;
      line-height:1.4;
    }
    summary{
      cursor:pointer;
      font-weight:700;
    }
  </style>
</head>

<body>
  <h1>DADICA 🎲</h1>
  <p class="subtitle">Pesca un dado. Poi lancia.</p>

  <div>
    <button id="pesca">Pesca un dado</button>
    <button id="lancia">Lancia il dado</button>
  </div>

  <div id="risultato"></div>

  <details>
    <summary>Cos’è Dadica</summary>
    <p>Dadica è un sistema simbolico di autoconoscenza. Attraverso i dadi parlerà l’Archetipo presente in quel momento o situazione.</p>
  </details>

    // stato
    let dadoPescato = false;
    let dadoIndex = null;

    function mostra(html){
      document.getElementById("risultato").innerHTML = html;
    }

    // Sostituisci RUNA / EBRAICO / PENT con i tuoi simboli reali quando vuoi.

[
  { simbolo: "0", archetipo: "Numero 0" },

  { simbolo: "א", archetipo: "Lettera ebraica – Aleph" },
  { simbolo: "☉", archetipo: "Sole" },
  { simbolo: "OPEN", archetipo: "Parola chiave" },
  { simbolo: "⛤", archetipo: "Pentacolo" }
],
      // DADO I
[
  { simbolo: "I", archetipo: "Numero I" },

  { simbolo: "⛤", archetipo: "Pentacolo" }

      // DADO II
[
  { simbolo: "II", archetipo: "Numero II" },
  { simbolo: "ᚦ", archetipo: "Runa – Thurisaz" },
  { simbolo: "ג", archetipo: "Lettera ebraica – Gimel" },
  { simbolo: "☾", archetipo: "Luna" },
  { simbolo: "HOLD", archetipo: "Parola chiave" },
  { simbolo: "⛤", archetipo: "Pentacolo" }
],
      // DADO III
[
  { simbolo: "III", archetipo: "Numero III" },
  { simbolo: "ᚨ", archetipo: "Runa – Ansuz" },
  { simbolo: "ד", archetipo: "Lettera ebraica – Dalet" },
  { simbolo: "♀", archetipo: "Venere" },
  { simbolo: "NURSE", archetipo: "Parola chiave" },
  { simbolo: "⛤", archetipo: "Pentacolo" }
],
      // DADO IV
[
  { simbolo: "IV", archetipo: "Numero IV" },
  { simbolo: "ᚱ", archetipo: "Runa – Raidho" },
  { simbolo: "ה", archetipo: "Lettera ebraica – He" },
  { simbolo: "♂", archetipo: "Marte" },
  { simbolo: "ORDER", archetipo: "Parola chiave" },
  { simbolo: "⛤", archetipo: "Pentacolo" }
],
      // DADO V
[

  { simbolo: "GUIDE", archetipo: "Parola chiave" },
  { simbolo: "⛤", archetipo: "Pentacolo" }
],

        { simbolo:"VI", archetipo:"Numero VI" },
        { simbolo:"RUNA", archetipo:"Runa" },
        { simbolo:"EBRAICO", archetipo:"Lettera ebraica" },

        { simbolo:"♂", archetipo:"Marte" },

        { simbolo:"PENT", archetipo:"Pentacolo" }
      ],
      // VIII

        { simbolo:"VIII", archetipo:"Numero VIII" },
        { simbolo:"RUNA", archetipo:"Runa" },
        { simbolo:"EBRAICO", archetipo:"Lettera ebraica" },
        { simbolo:"♄", archetipo:"Saturno" },
        { simbolo:"ALIGN", archetipo:"Parola chiave" },
        { simbolo:"PENT", archetipo:"Pentacolo" }
      ],
      // IX

        { simbolo:"IX", archetipo:"Numero IX" },
        { simbolo:"RUNA", archetipo:"Runa" },
        { simbolo:"EBRAICO", archetipo:"Lettera ebraica" },
        { simbolo:"☿", archetipo:"Mercurio" },
        { simbolo:"RETREAT", archetipo:"Parola chiave" },

        { simbolo:"XI", archetipo:"Numero XI" },

      [

        { simbolo:"☾", archetipo:"Luna" },
        { simbolo:"DREAM", archetipo:"Parola chiave" },
        { simbolo:"PENT", archetipo:"Pentacolo" }
      ],
      // XIX
      [
        { simbolo:"XIX", archetipo:"Numero XIX" },
        { simbolo:"RUNA", archetipo:"Runa" },
        { simbolo:"EBRAICO", archetipo:"Lettera ebraica" },
        { simbolo:"☉", archetipo:"Sole" },
        { simbolo:"SHINE", archetipo:"Parola chiave" },
        { simbolo:"PENT", archetipo:"Pentacolo" }
      ],
      // XX
      [
        { simbolo:"XX", archetipo:"Numero XX" },
        { simbolo:"RUNA", archetipo:"Runa" },
        { simbolo:"EBRAICO", archetipo:"Lettera ebraica" },
        { simbolo:"♆", archetipo:"Nettuno" },
        { simbolo:"CALL", archetipo:"Parola chiave" },
        { simbolo:"PENT", archetipo:"Pentacolo" }
      ],
      // XXI
      [
        { simbolo:"XXI", archetipo:"Numero XXI" },
        { simbolo:"RUNA", archetipo:"Runa" },
        { simbolo:"EBRAICO", archetipo:"Lettera ebraica" },
        { simbolo:"♄", archetipo:"Saturno" },
        { simbolo:"WHOLE", archetipo:"Parola chiave" },
        { simbolo:"PENT", archetipo:"Pentacolo" }
      ],
    ];

    const arcani = [
      "0 - Il Matto","I - Il Mago","II - La Papessa","III - L’Imperatrice","IV - L’Imperatore","V - Il Papa",
      "VI - Gli Amanti","VII - Il Carro","VIII - La Giustizia","IX - L’Eremita","X - La Ruota",
      "XI - La Forza","XII - L’Appeso","XIII - La Morte","XIV - La Temperanza","XV - Il Diavolo",
      "XVI - La Torre","XVII - La Stella","XVIII - La Luna","XIX - Il Sole","XX - Il Giudizio","XXI - Il Mondo"
    ];

    document.getElementById("pesca").addEventListener("click", () => {
      dadoPescato = true;
      dadoIndex = Math.floor(Math.random() * dadi.length);
      mostra("🎲 Dado pescato. Ora lancia.");
    });

    document.getElementById("lancia").addEventListener("click", () => {
      if(!dadoPescato || dadoIndex === null){
        alert("Prima pesca un dado");
        return;
      }

      const facciaIndex = Math.floor(Math.random() * 6);
      const faccia = dadi[dadoIndex][facciaIndex];
      const arcano = arcani[Math.floor(Math.random() * arcani.length)];

      mostra(`
        <div style="letter-spacing:2px; font-size:14px; opacity:.6;">DADO</div>
        <div style="font-size:44px; margin-top:6px;">${faccia.simbolo}</div>
        <div style="font-size:22px; margin-top:6px;">${faccia.archetipo}</div>

        <div style="letter-spacing:2px; font-size:14px; opacity:.6; margin-top:18px;">TAPPETO</div>
        <div style="font-size:30px; font-weight:800; margin-top:6px;">${arcano}</div>
      `);

      // reset: per rifare pesca+lancio ogni volta
      dadoPescato = false;
      dadoIndex = null;
    });
  </script>
</body>
</html>
