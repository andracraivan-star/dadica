<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DADICA</title>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      text-align:center;
      padding:24px;
      box-sizing:border-box;
    }
    h1{
      font-size:72px;
      margin:0 0 12px 0;
      letter-spacing:1px;
    }
    .subtitle{
      font-size:22px;
      margin:0 0 18px 0;
      opacity:0.8;
    }
    button{
      font-size:20px;
      padding:14px 18px;
      border-radius:14px;
      margin:6px;
    }
    #risultato{
      margin-top:18px;
      font-size:26px;
      min-height:80px;
    }
    details{
      margin-top:18px;
      max-width:700px;
      width:100%;
      font-size:18px;
      line-height:1.4;
    }
    summary{
      cursor:pointer;
      font-weight:700;
    }
  </style>
</head>

<body>
  <h1>DADICA 🎲</h1>
  <p class="subtitle">Pesca un dado. Poi lancia.</p>

  <div>
    <button id="pesca">Pesca un dado</button>
    <button id="lancia">Lancia il dado</button>
  </div>

  <div id="risultato"></div>

  <details>
    <summary>Cos’è Dadica</summary>
    <p>Dadica è un sistema simbolico di autoconoscenza. Attraverso i dadi parlerà l’Archetipo presente in quel momento o situazione.</p>
  </details>

  

    // reset
  <script>
  let dadoPescato = false;
  let dadoIndex = null;

  function mostra(html){
    document.getElementById("risultato").innerHTML = html;
  }

  // 22 dadi (per ora metto 2 esempi completi: aggiungi gli altri uguali)
  // Ogni dado = 6 facce: { simbolo: "...", archetipo: "..." }
  const dadi = [
    // DADO 0 (esempio: metti qui le tue 6 facce vere)
    [
      { simbolo: "0", archetipo: "Numero 0" },
      { simbolo: "ᚠ", archetipo: "Runa (esempio)" },
      { simbolo: "א", archetipo: "Lettera ebraica (esempio)" },
      { simbolo: "♄", archetipo: "Saturno" },
      { simbolo: "OPEN", archetipo: "Parola chiave" },
      { simbolo: "PENT", archetipo: "Pentacolo" }
    ],

    // DADO I (esempio)
    [
      { simbolo: "I", archetipo: "Numero I" },
      { simbolo: "ᚢ", archetipo: "Runa (esempio)" },
      { simbolo: "ב", archetipo: "Lettera ebraica (esempio)" },
      { simbolo: "☿", archetipo: "Mercurio" },
      { simbolo: "LINK", archetipo: "Parola chiave" },
      { simbolo: "PENT", archetipo: "Pentacolo" }
    ],

    // TODO: aggiungi qui gli altri 20 dadi (stessa struttura)
  ];

  const arcani = [
    "0 - Il Matto","I - Il Mago","II - La Papessa","III - L’Imperatrice","IV - L’Imperatore","V - Il Papa",
    "VI - Gli Amanti","VII - Il Carro","VIII - La Giustizia","IX - L’Eremita","X - La Ruota",
    "XI - La Forza","XII - L’Appeso","XIII - La Morte","XIV - La Temperanza","XV - Il Diavolo",
    "XVI - La Torre","XVII - La Stella","XVIII - La Luna","XIX - Il Sole","XX - Il Giudizio","XXI - Il Mondo"
  ];

  document.getElementById("pesca").onclick = function(){
    dadoPescato = true;
    dadoIndex = Math.floor(Math.random() * dadi.length); // sceglie quale dado (0..21 quando li metti tutti)
    mostra("Dado pescato. Ora lancia.");
  };

  document.getElementById("lancia").onclick = function(){
    if(!dadoPescato || dadoIndex === null){
      alert("Prima pesca un dado");
      return;
    }

    const facciaIndex = Math.floor(Math.random() * 6);       // 6 facce: 0..5
    const faccia = dadi[dadoIndex][facciaIndex];

    const arcano = arcani[Math.floor(Math.random() * arcani.length)];

    mostra(`
      <div style="letter-spacing:2px; font-size:14px; opacity:.6;">DADO</div>
      <div style="font-size:44px; margin-top:6px;">${faccia.simbolo}</div>
      <div style="font-size:22px; margin-top:6px;">${faccia.archetipo}</div>

      <div style="letter-spacing:2px; font-size:14px; opacity:.6; margin-top:18px;">TAPPETO</div>
      <div style="font-size:30px; font-weight:800; margin-top:6px;">${arcano}</div>
    `);

    // reset
    dadoPescato = false;
    dadoIndex = null;
  };
  </script>
</body>
</html>
