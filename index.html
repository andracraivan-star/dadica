function combina(simbolo, arcanoLabel, archetipoFaccia) {
  const tema = significatoArcani[arcanoLabel] || "un tema centrale";

  // Se è una parola chiave
  if (archetipoFaccia === "Parola chiave") {
    const azione = significatoDadi[simbolo] || "porta un’azione chiave";
    return `Parola chiave: ${simbolo} → ${azione} dentro: ${tema}.`;
  }

  // Altrimenti: runa / ebraico / pianeta / pentacolo / numero
  const significato = significatoSimboli[simbolo] || "attiva un principio simbolico";
  return `Simbolo: ${simbolo} (${archetipoFaccia}) → ${significato} dentro: ${tema}.`;
}

  const facciaIndex = Math.floor(Math.random() * 6);

const arcano = listaArcani[Math.floor(Math.random() * listaArcani.length)];

if (faccia.archetipo !== "Parola chiave" && significatoDadi[simbolo]) {

}

const frase = combina(simbolo, arcano, faccia.archetipo);

    // --- POPOLA I MENU "CERCA" ---
const selectParola = document.getElementById("selectParola");
const selectArcano = document.getElementById("selectArcano");
const risultatoCerca = document.getElementById("risultatoCerca");

// riempi simboli (parole + rune + ebraico + pianeti + pentacolo)
const tuttiISimboli = [
  ...Object.keys(significatoDadi),      // OPEN, LINK, ecc.
  ...Object.keys(significatoSimboli)    // ☉, ☿, ᚠ, א, ⛤, ecc.
];

// togli duplicati
const unici = [...new Set(tuttiISimboli)];

// aggiungi opzioni
unici.forEach(s => {
  const opt = document.createElement("option");
  opt.value = s;

  // etichetta carina: "☿ — Mercurio" oppure "ᚠ — Fehu" oppure "OPEN"
  const label = (significatoSimboli[s] || "").split(":")[0]; // prima del ":"
  opt.textContent = label ? `${s} — ${label}` : s;

  selectParola.appendChild(opt);
});

function popolaMenuArcani() {
  selectArcano.innerHTML = `<option value="">${uiText[lingua].scegliArcano}</option>`;
  getArcani().forEach(a => {
    const opt = document.createElement("option");
    opt.value = a;
    opt.textContent = a;
    selectArcano.appendChild(opt);
  });
}

popolaMenuArcani();

// --- AZIONE DEL TASTO CERCA ---
document.getElementById("cerca").addEventListener("click", () => {
  const parola = selectParola.value;
  const arcanoLabel = selectArcano.value;

  if(!parola || !arcanoLabel){
    risultatoCerca.innerHTML = `<div style="padding:12px; border:2px solid #333; border-radius:14px; background:#fff;">Scegli simbolo e arcano.</div>`;
    return;
  }

  const frase = combina(parola, arcanoLabel);

  risultatoCerca.innerHTML = `
    <div style="padding:14px; border:2px solid #333; border-radius:14px; background:#fafafa; font-size:18px; line-height:1.35;">
      ${frase}
    </div>
  `;
});

});

document.getElementById("langEN").addEventListener("click", () => {

aggiornaTesti();
