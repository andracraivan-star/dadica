<body style="text-align:center; font-family:sans-serif; margin-top:80px;">

  <h1>DADICA 🎲</h1>
  <p>Pesca un dado. Poi lancia.</p>

  <button id="pesca">Pesca un dado</button>
  <button id="lancia">Lancia il dado</button>

  <div id="risultato" style="margin-top:40px; font-size:24px;"></div>

  <script>
    let dadoPescato = false;

    document.getElementById("pesca").onclick = () => {
      dadoPescato = true;
      document.getElementById("risultato").innerText = "🎲 Dado pescato";
    };

    document.getElementById("lancia").onclick = () => {
      if (!dadoPescato) {
        alert("Prima pesca un dado");
        return;
      }
      const faccia = Math.floor(Math.random() * 6) + 1;
      document.getElementById("risultato").innerText =
        "🎲 Faccia uscita: " + faccia;
    };
  </script>

</body> <details>
  <summary>Cos’è Dadica</summary>
  <p>

    Attraverso i dadi parlerà l’Archetipo presente in quel momento o situazione.
