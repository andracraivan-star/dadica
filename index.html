<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DADICA</title>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      text-align:center;
      padding:24px;
      box-sizing:border-box;
    }
    h1{
      font-size:72px;
      margin:0 0 12px 0;
      letter-spacing:1px;
    }
    .subtitle{
      font-size:22px;
      margin:0 0 18px 0;
      opacity:0.8;
    }
    button{
      font-size:20px;
      padding:14px 18px;
      border-radius:14px;
      margin:6px;
    }
    #risultato{
      margin-top:18px;
      font-size:26px;
      min-height:80px;
    }
    details{
      margin-top:18px;
      max-width:700px;
      width:100%;
      font-size:18px;
      line-height:1.4;
    }
    summary{
      cursor:pointer;
      font-weight:700;
    }
  </style>
</head>

<body>
  <h1>DADICA 🎲</h1>
  <p class="subtitle">Pesca un dado. Poi lancia.</p>

  <div>
    <button id="pesca">Pesca un dado</button>
    <button id="lancia">Lancia il dado</button>
  </div>

  <div id="risultato"></div>

  <details>
    <summary>Cos’è Dadica</summary>
    <p>Dadica è un sistema simbolico di autoconoscenza. Attraverso i dadi parlerà l’Archetipo presente in quel momento o situazione.</p>
  </details>

  <script>
  // stato
  let dadoPescato = false;
  let indiceDadoScelto = null;

  // 22 dadi (per ora mettiamo solo 1 dado di esempio + tappeto 22)
  // IMPORTANTISSIMO: ogni DADO deve avere 6 facce.
  const dadi = [
    {
      nome: "DADO VII",
      facce: [
        { simbolo: "⚫", archetipo: "Saturno" },
        { simbolo: "⚪", archetipo: "Luna" },
        { simbolo: "🔴", archetipo: "Marte" },
        { simbolo: "🟢", archetipo: "Venere" },
        { simbolo: "🔵", archetipo: "Mercurio" },
        { simbolo: "🟡", archetipo: "Sole" },
      ],
    },
  ];

  const archetipiTappeto = [
    "0 - Il Matto","I - Il Mago","II - La Papessa","III - L’Imperatrice","IV - L’Imperatore","V - Il Papa",
    "VI - Gli Amanti","VII - Il Carro","VIII - La Giustizia","IX - L’Eremita","X - La Ruota","XI - La Forza",
    "XII - L’Appeso","XIII - La Morte","XIV - La Temperanza","XV - Il Diavolo","XVI - La Torre","XVII - La Stella",
    "XVIII - La Luna","XIX - Il Sole","XX - Il Giudizio","XXI - Il Mondo"
  ];
const significatiDado = {
  "Saturno": "Struttura, limite, responsabilità, tempo che matura.",
  "Luna": "Emozioni, inconscio, cicli, sensibilità.",
  "Marte": "Azione, taglio, decisione, energia diretta.",
  "Venere": "Relazione, valore, attrazione, armonia.",
  "Mercurio": "Messaggio, scambio, mente, collegamento.",
  "Sole": "Identità, chiarezza, vitalità, centro."
};
  function mostra(html){
    document.getElementById("risultato").innerHTML = html;
  }

  document.getElementById("pesca").onclick = function () {
    dadoPescato = true;

    // scegli un dado (per ora solo 1: indice 0)
    indiceDadoScelto = Math.floor(Math.random() * dadi.length);

    mostra("Dado pescato. Ora lancia.");
  };

  document.getElementById("lancia").onclick = function () {
    if (!dadoPescato) {
      alert("Prima pesca un dado");
      return;
    }

    // dado scelto + faccia 0..5 (6 facce)
    const dado = dadi[indiceDadoScelto];
    const indiceFaccia = Math.floor(Math.random() * 6);
    const faccia = dado.facce[indiceFaccia];

    // tappeto (arcano) 0..21
    const indiceArcano = Math.floor(Math.random() * archetipiTappeto.length);
    const arcano = archetipiTappeto[indiceArcano];

    mostra(`
  <div style="font-size:44px;">${simbolo}</div>

  <div style="font-size:12px; letter-spacing:2px; margin-top:10px;">DADO</div>
  <div style="font-size:20px; margin-top:6px;">${archetipoDado}</div>
  <div style="font-size:16px; margin-top:4px; opacity:0.8;">
    ${significatiDado[archetipoDado]}
  </div>

  <div style="font-size:12px; letter-spacing:2px; margin-top:16px;">TAPPETO</div>
  <div style="font-size:26px; font-weight:700; margin-top:6px;">
    ${archetipo}
  </div>
`);

    // reset
    dadoPescato = false;
  };
  </script>
</body>
</html>
