<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DADICA</title>
</head>
<body style="text-align:center; font-family:sans-serif; margin-top:60px;">

  <h1 style="margin-bottom:10px;">DADICA 🎲</h1>
  <div style="opacity:.7; margin-bottom:30px;">Tocca il dado</div>

  <div id="dice" style="font-size:90px; cursor:pointer; user-select:none;">🎲</div>

  <div id="card" style="margin:30px auto; width:min(520px, 92vw); padding:18px; border:1px solid #ddd; border-radius:14px;">
    <div id="symbol" style="font-size:64px; margin-bottom:8px;">ᚠ</div>
    <div id="name" style="font-size:22px; font-weight:700;">Fehu</div>
    <div id="meaning" style="margin-top:10px; font-size:16px; line-height:1.5; opacity:.85;">
      Ricchezza, energia, inizio. Cosa stai nutrendo?
    </div>
  </div>

  <script>
    // QUI cambi la lista: rune / simboli / archetipi del tappeto
    const symbols = [
      { symbol: "ᚠ", name: "Fehu", meaning: "Ricchezza, energia, inizio. Cosa stai nutrendo?" },
      { symbol: "ᚢ", name: "Uruz", meaning: "Forza, corpo, resistenza. Dove serve coraggio?" },
      { symbol: "ᚦ", name: "Thurisaz", meaning: "Soglia, protezione, attenzione. Cosa va filtrato?" },
      { symbol: "ᚨ", name: "Ansuz", meaning: "Messaggio, voce, ispirazione. Cosa vuole essere detto?" },
      { symbol: "ᚱ", name: "Raidho", meaning: "Viaggio, direzione, ritmo. Qual è il prossimo passo?" },
      { symbol: "ᚲ", name: "Kenaz", meaning: "Luce, comprensione, fuoco creativo. Cosa illumini ora?" }
    ];

    const dice = document.getElementById("dice");
    const elSymbol = document.getElementById("symbol");
    const elName = document.getElementById("name");
    const elMeaning = document.getElementById("meaning");

    function roll() {
      const i = Math.floor(Math.random() * symbols.length);
      const pick = symbols[i];
      elSymbol.textContent = pick.symbol;
      elName.textContent = pick.name;
      elMeaning.textContent = pick.meaning;
    }

    dice.onclick = roll;
  </script>

</body>
</html>
