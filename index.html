    }

      border-radius:16px;

    }

      gap:10px;
      margin-bottom:8px;
    }

      border:1px solid var(--border);

      color:#333;

      text-align:left;
    }
    .meaning{

      font-size:16px;
      line-height:1.35;
    }
    .twoCols{

      gap:10px;
      margin-top:10px;
    }

/* ---------------------------
   Limite 3 lanci al giorno (localStorage)
---------------------------- */
const MAX_ROLLS_PER_DAY = 3;
function todayKey(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function getRollState(){
  const key = "dadica_rolls_" + todayKey();
  const used = Number(localStorage.getItem(key) || "0");
  return { key, used, left: Math.max(0, MAX_ROLLS_PER_DAY - used) };
}
function incRoll(){
  const s = getRollState();
  const next = Math.min(MAX_ROLLS_PER_DAY, s.used + 1);
  localStorage.setItem(s.key, String(next));
  return getRollState();
}

function pickRandom(arr){ return arr[randInt(arr.length)]; }

/* ---------------------------
   Interpretazione generativa (Luce/Ombra)
---------------------------- */
function buildInterpretation(arc, face){
  const base = `${arc.name}: ${arc.core}.`;
  const faceLine = `Faccia "${face.glyph}" (${face.tag}): ${face.meaning}.`;

  const light = [];
  const shadow = [];

  // regole semplici in base al tag
  if(face.tag === "parola"){
    light.push(`Azione chiara: applica "${face.glyph}" in modo concreto.`);
    shadow.push(`Impulso o rigidità: "${face.glyph}" può diventare automatismo.`);
  } else if(face.tag === "lettera" || face.tag === "runa"){
    light.push(`Messaggio sottile: ascolta il simbolo come “chiave” intuitiva.`);
    shadow.push(`Confusione simbolica: rischio di interpretare tutto e il contrario di tutto.`);
  } else if(face.tag === "astro"){
    light.push(`Energia planetaria come carburante: usa il tono di "${face.glyph}" per muoverti.`);
    shadow.push(`Eccesso d’energia: la qualità di "${face.glyph}" può andare fuori misura.`);
  } else if(face.tag === "sigillo"){
    light.push(`Protezione/centratura: chiudi ciò che disperde e crea confini sani.`);
    shadow.push(`Iper-protezione: chiuderti troppo può bloccare il flusso.`);
  } else { // numero / segno
    light.push(`Indicazione di ritmo: segui il “tempo” che il segno suggerisce.`);
    shadow.push(`Fissazione sul segno: diventare superstiziosa invece che presente.`);
  }

  // aggiunta legata alla Giustizia / ecc: aggancio al core dell’arcano
  light.push(`Porta ${arc.core} dentro la situazione di oggi, passo per passo.`);
  shadow.push(`Quando ${arc.core} viene forzato, nasce tensione o resistenza.`);

  const question =
    `Se "${face.glyph}" incontrasse ${arc.name}, quale piccola scelta fa
