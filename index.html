<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DADICA</title>
  <style>
    body{
      margin:0; min-height:100vh; display:flex; flex-direction:column;
      justify-content:center; align-items:center; text-align:center;
      padding:24px; box-sizing:border-box;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background: linear-gradient(180deg,#eaf4ff,#cfe9ff,#b7ddff);
    }
    h1{ font-size:72px; margin:0 0 12px; letter-spacing:1px; }
    .subtitle{ font-size:22px; margin:0 0 18px; opacity:.8; }
    button{
      font-size:20px; padding:14px 18px; border-radius:14px; margin:6px;
      border:2px solid #333; background:#eee;
    }
    #risultato{
      margin-top:18px; font-size:26px; min-height:120px;
      width:100%; max-width:700px;
    }
    details{ margin-top:18px; max-width:700px; width:100%; font-size:18px; line-height:1.4; }
    summary{ cursor:pointer; font-weight:700; }
    .sfera{
      width:120px; height:120px; margin:22px auto 10px; border-radius:999px;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.95), rgba(170,200,240,.9) 35%, rgba(80,120,180,.9) 70%);
      box-shadow: 0 18px 35px rgba(0,0,0,0.18), inset 0 0 0 2px rgba(255,255,255,0.35);
      opacity:.75;
    }
    select{ font-size:18px; padding:10px; margin:6px; }
    hr{ margin:32px 0; width:100%; max-width:700px; }
  </style>
</head>

<body>
  <div style="margin-bottom:16px;">
    <button id="langIT">🇮🇹 IT</button>
    <button id="langEN">🇬🇧 EN</button>
  </div>

  <h1>DADICA 🎲</h1>
  <p class="subtitle">Porta l’attenzione al cuore, respira, lancia quando ti senti in pace.</p>
  <div class="sfera"></div>
  <p style="font-size:14px; opacity:.6; margin-top:-10px;">✦</p>

  <div>
    <button id="pesca">Pesca un dado</button>
    <button id="lancia">Lancia il dado</button>
  </div>

  <div id="risultato"></div>

  <hr>

  <h2 style="font-size:26px;">🔍 Cerca una combinazione</h2>

  <select id="selectParola">
    <option value="">— scegli il simbolo —</option>
  </select>

  <select id="selectArcano">
    <option value="">— scegli l’arcano —</option>
  </select>

  <br>
  <button id="cerca">Cerca combinazione</button>
  <div id="risultatoCerca" style="margin-top:14px; max-width:700px; width:100%;"></div>

  <details>
    <summary>Cos’è Dadica</summary>
    <p>Dadica è un sistema simbolico di autoconoscenza. Attraverso i dadi parlerà l’Archetipo presente in quel momento o situazione.</p>
  </details>

<script>
let lingua = "it";

const uiText = {
  it: {
    subtitle: "Porta l’attenzione al cuore, respira, lancia quando ti senti in pace.",
    pesca: "Pesca un dado",
    lancia: "Lancia il dado",
    dadoPescato: "🎲 Dado pescato. Ora lancia.",
    alertPescaPrima: "Prima pesca un dado",
    cercaTitolo: "🔍 Cerca una combinazione",
    cercaBtn: "Cerca combinazione",
    scegliSimbolo: "— scegli il simbolo —",
    scegliArcano: "— scegli l’arcano —",
    errore: "Scegli simbolo e arcano."
  },
  en: {
    subtitle: "Bring attention to your heart, breathe, roll when you feel calm.",
    pesca: "Draw a die",
    lancia: "Roll the die",
    dadoPescato: "🎲 Die selected. Now roll.",
    alertPescaPrima: "Draw a die first",
    cercaTitolo: "🔍 Search a combination",
    cercaBtn: "Search combination",
    scegliSimbolo: "— choose a symbol —",
    scegliArcano: "— choose an arcana —",
    errore: "Choose a symbol and an arcana."
  }
};
function t(key){ return uiText[lingua][key]; }

const selectParola = document.getElementById("selectParola");
const selectArcano = document.getElementById("selectArcano");
const risultatoCerca = document.getElementById("risultatoCerca");

function aggiornaTesti(){
  const sub = document.querySelector(".subtitle");
  if(sub) sub.textContent = t("subtitle");
  document.getElementById("pesca").textContent = t("pesca");
  document.getElementById("lancia").textContent = t("lancia");
  document.querySelector("h2").textContent = t("cercaTitolo");
  document.getElementById("cerca").textContent = t("cercaBtn");

  const op1 = document.querySelector("#selectParola option[value='']");
  const op2 = document.querySelector("#selectArcano option[value='']");
  if(op1) op1.textContent = t("scegliSimbolo");
  if(op2) op2.textContent = t("scegliArcano");
}

const arcaniIT = [
  "0 - Il Matto","I - Il Mago","II - La Papessa","III - L’Imperatrice","IV - L’Imperatore","V - Il Papa",
  "VI - Gli Amanti","VII - Il Carro","VIII - La Giustizia","IX - L’Eremita","X - La Ruota",
  "XI - La Forza","XII - L’Appeso","XIII - La Morte","XIV - La Temperanza","XV - Il Diavolo",
  "XVI - La Torre","XVII - La Stella","XVIII - La Luna","XIX - Il Sole","XX - Il Giudizio","XXI - Il Mondo"
];
const arcaniEN = [
  "0 - The Fool","I - The Magician","II - The High Priestess","III - The Empress","IV - The Emperor","V - The Hierophant",
  "VI - The Lovers","VII - The Chariot","VIII - Justice","IX - The Hermit","X - Wheel of Fortune",
  "XI - Strength","XII - The Hanged Man","XIII - Death","XIV - Temperance","XV - The Devil",
  "XVI - The Tower","XVII - The Star","XVIII - The Moon","XIX - The Sun","XX - Judgement","XXI - The World"
];
function getArcani(){ return lingua === "en" ? arcaniEN : arcaniIT; }

function aggiornaDropdownArcani(){
  const prev = selectArcano.value;
  selectArcano.innerHTML = "";
  const opt0 = document.createElement("option");
  opt0.value = "";
  opt0.textContent = t("scegliArcano");
  selectArcano.appendChild(opt0);
  getArcani().forEach(a => {
    const opt = document.createElement("option");
    opt.value = a;
    opt.textContent = a;
    selectArcano.appendChild(opt);
  });
  if(prev) selectArcano.value = prev;
}

let dadoPescato = false;
let dadoIndex = null;

function mostra(html){
  document.getElementById("risultato").innerHTML = html;
}

// --- DADI (metto versione corta; poi rimettiamo tutti e 22) ---
const dadi = [
  [
    { simbolo: "0", archetipo: "Numero 0" },
    { simbolo: "ᚠ", archetipo: "Runa – Fehu" },
    { simbolo: "א", archetipo: "Lettera ebraica – Aleph" },
    { simbolo: "☉", archetipo: "Sole" },
    { simbolo: "OPEN", archetipo: "Parola chiave" },
    { simbolo: "⛤", archetipo: "Pentacolo" }
  ],
  [
    { simbolo: "I", archetipo: "Numero I" },
    { simbolo: "ᚢ", archetipo: "Runa – Uruz" },
    { simbolo: "ב", archetipo: "Lettera ebraica – Bet" },
    { simbolo: "☿", archetipo: "Mercurio" },
    { simbolo: "LINK", archetipo: "Parola chiave" },
    { simbolo: "⛤", archetipo: "Pentacolo" }
  ]
];

// popola selectParola con tutti i simboli dei dadi
function popolaSelectParola(){
  selectParola.innerHTML = '<option value="">' + t("scegliSimbolo") + '</option>';
  [...new Set(dadi.flat().map(f => f.simbolo))].forEach(s => {
    const o = document.createElement("option");
    o.value = s;
    o.textContent = s;
    selectParola.appendChild(o);
  });
}

// --- listeners lingua ---
document.getElementById("langIT")?.addEventListener("click", () => {
  lingua = "it";
  aggiornaTesti();
  aggiornaDropdownArcani();
  popolaSelectParola();
});
document.getElementById("langEN")?.addEventListener("click", () => {
  lingua = "en";
  aggiornaTesti();
  aggiornaDropdownArcani();
  popolaSelectParola();
});

// --- bottoni pesca/lancia ---
document.getElementById("pesca").addEventListener("click", () => {
  dadoPescato = true;
  dadoIndex = Math.floor(Math.random() * dadi.length);
  mostra(t("dadoPescato"));
});

document.getElementById("lancia").addEventListener("click", () => {
  if(!dadoPescato || dadoIndex === null){
    alert(t("alertPescaPrima"));
    return;
  }
  const facciaIndex = Math.floor(Math.random() * 6);
  const faccia = dadi[dadoIndex][facciaIndex];
  const arcano = getArcani()[Math.floor(Math.random() * getArcani().length)];
  mostra(`🎲 ${faccia.simbolo} <br><div style="font-size:18px;opacity:.8">${faccia.archetipo}</div><div style="margin-top:10px;font-size:20px;">🃏 ${arcano}</div>`);
  // reset
  dadoPescato = false;
  dadoIndex = null;
});

// --- cerca combinazione (solo demo) ---
document.getElementById("cerca").addEventListener("click", () => {
  const s = selectParola.value;
  const a = selectArcano.value;
  if(!s || !a){
    risultatoCerca.innerHTML = `<div style="font-size:18px;color:#333;">${t("errore")}</div>`;
    return;
  }
  risultatoCerca.innerHTML = `<div style="font-size:18px;">${s} + ${a}</div>`;
});

// avvio
aggiornaTesti();
aggiornaDropdownArcani();
popolaSelectParola();
</script>
</body>
</html>
