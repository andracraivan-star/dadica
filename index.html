<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DADICA</title>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      text-align:center;
      padding:24px;
      box-sizing:border-box;
    }
    h1{
      font-size:72px;
      margin:0 0 12px 0;
      letter-spacing:1px;
    }
    .subtitle{
      font-size:22px;
      margin:0 0 18px 0;
      opacity:0.8;
    }
    button{
      font-size:20px;
      padding:14px 18px;
      border-radius:14px;
      margin:6px;
    }
    #risultato{
      margin-top:18px;
      font-size:26px;
      min-height:80px;
    }
    details{
      margin-top:18px;
      max-width:700px;
      width:100%;
      font-size:18px;
      line-height:1.4;
    }
    summary{
      cursor:pointer;
      font-weight:700;
    }
  </style>
</head>

<body>
  <h1>DADICA 🎲</h1>
  <p class="subtitle">Pesca un dado. Poi lancia.</p>

  <div>
    <button id="pesca">Pesca un dado</button>
    <button id="lancia">Lancia il dado</button>
  </div>

  <div id="risultato"></div>

  <details>
    <summary>Cos’è Dadica</summary>
    <p>Dadica è un sistema simbolico di autoconoscenza. Attraverso i dadi parlerà l’Archetipo presente in quel momento o situazione.</p>
  </details>

  <script>
    let dadoPescato = false;

    const simboliDado = ["⚪", "⚫", "🔴", "🟢", "🔵", "🟡"]; // sostituisci coi tuoi simboli
    const archetipiDado = [
  "Saturno",
  "Luna",
  "Marte",
  "Venere",
  "Mercurio",
  "Sole"
];

    function mostra(html){
      document.getElementById("risultato").innerHTML = html;
    }

    document.getElementById("pesca").onclick = function(){
      dadoPescato = true;
      mostra("🎲 Dado pescato. Ora lancia.");
    };

    document.getElementById("lancia").onclick = function(){
      if(!dadoPescato){
        alert("Prima pesca un dado");
        return;
      }

      const indiceDado = Math.floor(Math.random() * simboliDado.length);
const simbolo = simboliDado[indiceDado];
const archetipoDado = archetipiDado[indiceDado];

      mostra(`
  <div style="font-size:44px;">${simbolo}</div>
  <div style="font-size:20px; margin-top:6px;">${archetipoDado}</div>
  <div style="font-size:26px; font-weight:700; margin-top:14px;">${archetipo}</div>
`);

      dadoPescato = false;
    };
  </script>
</body>
</html>
