/* =========================

// Se hai già const dadi altrove, NON duplicare qui.

/* --- stato pesca/lancio --- */
let dadoPescato = false;
let dadoIndex = null;

function mostra(html){
  document.getElementById("risultato").innerHTML = html;
}

/* --- combina: qualunque simbolo + arcano --- */
function combina(simbolo, arcanoLabel, tipoFaccia){
  const isEN = lingua === "en";

  const tema = isEN
    ? (significatoArcaniEN[arcanoLabel] || "a central theme")
    : (significatoArcaniIT[arcanoLabel] || "un tema centrale");

  // Se è una parola chiave (OPEN/LINK/...) -> usa dizionario parole
  const azione = (isEN ? significatoDadiEN[simbolo] : significatoDadiIT[simbolo]);
  if(azione){
    return isEN
      ? `Keyword: <b>${simbolo}</b> → ${azione}<br><small>Mat / Arcana: ${arcanoLabel} → ${tema}</small>`
      : `Parola chiave: <b>${simbolo}</b> → ${azione}<br><small>Tappeto / Arcano: ${arcanoLabel} → ${tema}</small>`;
  }

  // Altrimenti: simbolo (runa/ebraico/pianeta/pentacolo/numero)
  const sig = isEN
    ? (significatoSimboliEN[simbolo] || "activates a symbolic principle")
    : (significatoSimboliIT[simbolo] || "attiva un principio simbolico");

  const etichettaTipo = tipoFaccia ? ` (${tipoFaccia})` : "";

  return isEN
    ? `Symbol: <b>${simbolo}</b>${etichettaTipo} → ${sig}<br><small>Mat / Arcana: ${arcanoLabel} → ${tema}</small>`
    : `Simbolo: <b>${simbolo}</b>${etichettaTipo} → ${sig}<br><small>Tappeto / Arcano: ${arcanoLabel} → ${tema}</small>`;
}

/* --- dropdown arcani --- */
function aggiornaDropdownArcani(){
  const selectArcano = document.getElementById("selectArcano");
  if(!selectArcano) return;

  const keepFirst = selectArcano.querySelector("option[value='']");
  selectArcano.innerHTML = "";
  const first = document.createElement("option");
  first.value = "";
  first.textContent = t("scegliArcano");
  selectArcano.appendChild(first);

  getArcani().forEach(a=>{
    const opt = document.createElement("option");
    opt.value = a;
    opt.textContent = a;
    selectArcano.appendChild(opt);
  });
}

/* --- dropdown simboli: prende TUTTI i simboli dai dadi --- */
function popolaSelectSimboli(){
  const selectParola = document.getElementById("selectParola");
  if(!selectParola) return;

  selectParola.innerHTML = "";
  const first = document.createElement("option");
  first.value = "";
  first.textContent = t("scegliSimbolo");
  selectParola.appendChild(first);

  // raccogli simboli unici
  const set = new Set();
  if(typeof dadi !== "undefined"){
    dadi.forEach(d=> d.forEach(f=> set.add(f.simbolo)));
  }

  // ordina “carino”
  const lista = Array.from(set).sort((a,b)=> (a>b?1:-1));
  lista.forEach(s=>{
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = s;
    selectParola.appendChild(opt);
  });
}

/* --- lingua buttons --- */
document.getElementById("langIT")?.addEventListener("click", ()=>{
  lingua = "it";
  aggiornaTesti();
  aggiornaDropdownArcani();
  popolaSelectSimboli();
});
document.getElementById("langEN")?.addEventListener("click", ()=>{
  lingua = "en";
  aggiornaTesti();
  aggiornaDropdownArcani();
  popolaSelectSimboli();
});

/* --- pesca --- */
document.getElementById("pesca").addEventListener("click", ()=>{
  dadoPescato = true;
  dadoIndex = Math.floor(Math.random() * dadi.length);
  mostra(`<div style="font-size:22px;">${t("pescato")}</div>`);
});

/* --- lancia --- */
document.getElementById("lancia").addEventListener("click", ()=>{
  if(!dadoPescato || dadoIndex === null){
    alert(t("primaPesca"));
    return;
  }

  const facciaIndex = Math.floor(Math.random() * 6);
  const faccia = dadi[dadoIndex][facciaIndex];

  const listaArcani = getArcani();
  const arcano = listaArcani[Math.floor(Math.random() * listaArcani.length)];

  const testo = combina(faccia.simbolo, arcano, faccia.archetipo);

  mostra(`
    <div style="font-size:18px; opacity:.8;">Dado: <b>${dadoIndex+1}</b> · Faccia: <b>${facciaIndex+1}</b></div>
    <div style="margin-top:10px; font-size:26px;">${testo}</div>
  `);

  // reset (così devi ripescare)
  dadoPescato = false;
  dadoIndex = null;
});

/* --- cerca combinazione (vera) --- */
document.getElementById("cerca").addEventListener("click", ()=>{
  const selectParola = document.getElementById("selectParola");
  const selectArcano = document.getElementById("selectArcano");
  const risultatoCerca = document.getElementById("risultatoCerca");

  const s = selectParola.value;
  const a = selectArcano.value;

  if(!s || !a){
    risultatoCerca.innerHTML = `<div style="font-size:18px; opacity:.8;">${t("errore")}</div>`;
    return;
  }

  // tipo faccia (se lo troviamo)
  let tipo = "";
  if(typeof dadi !== "undefined"){
    outer:
    for(const d of dadi){
      for(const f of d){
        if(f.simbolo === s){
          tipo = f.archetipo || "";
          break outer;
        }
      }
    }
  }

  risultatoCerca.innerHTML = `<div style="font-size:22px;">${combina(s, a, tipo)}</div>`;
});

/* --- avvio --- */
aggiornaTesti();
aggiornaDropdownArcani();
popolaSelectSimboli();
</script>
