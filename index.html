<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>DADICA</title>
</head>

<body style="text-align:center; font-family:sans-serif; margin-top:60px;">

<h1>DADICA 🎲</h1>

<p>Pesca un dado. Poi lancia.</p>

<button onclick="pescaDado()">Pesca un dado</button>
<button onclick="lanciaDado()">Lancia il dado</button>

<div id="risultato" style="margin-top:30px; font-size:20px;"></div>

<script>
let dadoPescato = null;

const arcani = [
  "0 – Il Matto","I – Il Mago","II – La Papessa","III – L’Imperatrice",
  "IV – L’Imperatore","V – Il Papa","VI – Gli Amanti","VII – Il Carro",
  "VIII – La Giustizia","IX – L’Eremita","X – La Ruota",
  "XI – La Forza","XII – L’Appeso","XIII – La Morte",
  "XIV – La Temperanza","XV – Il Diavolo","XVI – La Torre",
  "XVII – La Stella","XVIII – La Luna","XIX – Il Sole",
  "XX – Il Giudizio","XXI – Il Mondo"
];

function pescaDado() {
  dadoPescato = Math.floor(Math.random() * 22);
  document.getElementById("risultato").innerText =
    "Dado pescato. Ora lancia.";
}

function lanciaDado() {
  if (dadoPescato === null) {
    alert("Prima pesca un dado");
    return;
  }

  const faccia = Math.floor(Math.random() * 6) + 1;
  const arcano = arcani[Math.floor(Math.random() * arcani.length)];

  document.getElementById("risultato").innerHTML =
    "<b>" + arcano + "</b><br>Faccia uscita: " + faccia;
}
</script>

</body>
</html>
